server {
    listen 80;
    server_name _;

    # Chemin absolu vers ton projet Symfony
    root /srv/app/public;
    index index.php index.html;

    # Logs pour debug
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Requête vers Symfony
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass backend-symfony:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        # Chemin absolu pour PHP-FPM
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Optionnel : augmenter les limites
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Sécuriser .htaccess ou fichiers cachés
    location ~ /\.ht {
        deny all;
    }

    # Optionnel : sécurité pour uploads
    location ~* /uploads/.*\.(php|phtml)$ {
        deny all;
    }
}
